name: Release Evidence Gate

on:
  workflow_dispatch:

jobs:
  release-evidence:
    name: Verify Real Deployment Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run contracts:compile
      - run: npm run production:guard
      - run: npm run release:gate
