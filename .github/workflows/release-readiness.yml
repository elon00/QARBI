name: Release Readiness - Strict Attestation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release-evidence/**'
      - 'scripts/release-attestation-gate.mjs'
      - '.github/workflows/release-readiness.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner syntax and negative release tests
        run: |
          node --check scripts/mission-verify.mjs
          node --check scripts/raven-rea-rsi-runner.mjs
          node --test test/release-attestation-negative.test.mjs
      - run: npm test
      - run: npm run build
      - name: Strict release gate (manual release verification only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-attestation-gate.mjs
