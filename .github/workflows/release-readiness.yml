name: Release Readiness - Strict Attestation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release-evidence/**'
      - 'scripts/release-attestation-gate.mjs'
      - '.github/workflows/release-readiness.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Evidence attestation gate (intentionally fails until genuine artifacts supplied)
        run: node scripts/release-attestation-gate.mjs
