name: Release Readiness - Strict Attestation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release-evidence/**'
      - 'scripts/release-attestation-gate.mjs'
      - 'scripts/QARBI_MASTER_ALL_IN_ONE.ps1'
      - '.github/workflows/release-readiness.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner syntax and negative release tests
        run: |
          node --check scripts/mission-verify.mjs
          node --check scripts/raven-rea-rsi-runner.mjs
          node --test test/release-attestation-negative.test.mjs
      - run: npm test
      - run: npm run build
      - name: Strict release gate (manual release verification only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-attestation-gate.mjs

  windows-powershell-syntax:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate Windows PowerShell 5.1 master runner syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'scripts/QARBI_MASTER_ALL_IN_ONE.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell parser: PASS (syntax only; not an execution or production certificate)'
