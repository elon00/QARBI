name: Magic Fix Verification

on:
  workflow_dispatch:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run one-click verification
        run: npm run magic:fix
