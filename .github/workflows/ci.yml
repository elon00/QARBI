name: CI - Build & Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities (high and critical)
        run: npm audit --audit-level=high

      - name: Verify mission exit-code fail-closed regression cases
        run: node --test test/mission-status.test.mjs

      - name: Reject incomplete or ambiguous testnet contract manifests
        run: node --test test/contract-manifest-guard.test.mjs

      - name: Verify RPC logging redacts credential-bearing URL components
        run: node --test test/rpc-log-safety.test.mjs

      - name: Run truth, environment and build verification
        run: npm test

      - name: Execute bounded REA/RSI runner and verify fail-closed audit evidence
        run: |
          npm run gate:rsi
          node --test test/rsi-audit-evidence.test.mjs
          node scripts/validate-rsi-audit.mjs

      - name: Verify conservative scorecard and REA/RSI syntax
        run: |
          node --check scripts/reality-scorecard-v3.mjs
          node --check scripts/raven-rea-rsi-runner.mjs
          npm run reality:scorecard
          node --input-type=module -e "import fs from 'node:fs'; const s = JSON.parse(fs.readFileSync('reality/GLOBAL_REALITY_SCORECARD_v3.json', 'utf8')); if (s.summary.isProductionCertified || s.summary.engineeringScore >= 100 || !['G04','G11','G12'].every(id => s.gates.some(g => g.id === id && g.status === 'BLOCKED'))) throw new Error('Reality scorecard must remain uncertified without external evidence');"

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "dist directory missing"; exit 1; }
          test -f dist/server.cjs || { echo "server.cjs bundle missing"; exit 1; }
          test -f dist/index.html || { echo "index.html bundle missing"; exit 1; }
          echo "All build artifacts successfully verified!"
