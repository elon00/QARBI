name: CI - Build & Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run truth, environment and build verification
        run: npm test

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "dist directory missing"; exit 1; }
          test -f dist/server.cjs || { echo "server.cjs bundle missing"; exit 1; }
          test -f dist/index.html || { echo "index.html bundle missing"; exit 1; }
          echo "All build artifacts successfully verified!"
