name: CI - Build & Quality Assurance

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-guard:
    name: Build, Typecheck & Production Guard (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile Smart Contracts
        run: npm run contracts:compile

      - name: Production Guard
        run: npm run production:guard

      - name: Production Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d dist
          test -f dist/server.cjs
          test -f dist/index.html
          echo "Build artifacts verified."
